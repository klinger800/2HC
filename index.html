<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14110e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="2H Lvl 1" />
  <title>2H Level 1 Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='12' width='64' height='64' fill='%23c47a2c'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' font-family='Georgia' fill='%2314110e'%3E2H%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #14110e;
      --bg-2: #1c1814;
      --panel: #221c17;
      --panel-2: #2a231c;
      --line: #3a3128;
      --text: #f3eadf;
      --muted: #b3a394;
      --faint: #7d7164;
      --accent: #e09a3e;
      --accent-2: #c47a2c;
      --good: #8fbf6a;
      --bad: #d0725a;
      --input: #2f281f;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
      --radius: 12px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; }
    html {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: "Aptos Narrow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.25;
      min-height: 100dvh;
      padding-bottom: calc(16px + var(--safe-b));
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: calc(10px + var(--safe-t)) 10px 20px;
    }
    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .brand { display: flex; gap: 8px; align-items: center; min-width: 0; }
    .mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(160deg, #e6ae5d, #b86a1f);
      color: #1a140e; display: grid; place-items: center;
      font-weight: 800; font-size: .82rem; letter-spacing: .02em; flex: none;
    }
    h1 { margin: 0; font-size: 1.02rem; letter-spacing: .01em; }
    .sub { color: var(--muted); font-size: .75rem; margin-top: 1px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: .78rem;
    }
    .btn:hover { border-color: var(--accent-2); }
    .btn.primary {
      background: linear-gradient(180deg, #d8923a, #b56d22);
      border-color: #e0a24d;
      color: #1a140e;
      font-weight: 700;
    }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--bad); border-color: #5a3a32; }
    .cloud {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      margin: 0 0 10px; padding: 8px; border: 1px solid var(--line);
      border-radius: 12px; background: #1a1612;
    }
    .cloud input {
      background: var(--input); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 6px 8px; min-height: 32px; font-size: 16px;
    }
    .cloud input.code { width: 11rem; font-family: ui-monospace, monospace; font-size: 13px; }
    .cloud input.email { width: min(100%, 16rem); }
    .cloud-status { color: var(--muted); font-size: .75rem; }
    .cloud-status.ok { color: var(--good); }
    .cloud-status.bad { color: var(--bad); }
    .tab {
      flex: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 5px 10px;
      color: var(--muted);
      font-size: .78rem;
    }
    .tab.active {
      background: #3a2c1c;
      color: var(--text);
      border-color: var(--accent-2);
    }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--bg-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-head {
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
      padding: 8px 10px; border-bottom: 1px solid var(--line);
    }
    .card-head h2 { margin: 0; font-size: .95rem; }
    .hint { color: var(--faint); font-size: .72rem; padding: 0 10px 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 5px 4px; text-align: center; border-bottom: 1px solid var(--line); font-size: .82rem; }
    th { color: var(--muted); font-weight: 600; font-size: .65rem; letter-spacing: .04em; text-transform: uppercase; }
    td.ex, th.ex { text-align: left; padding-left: 8px; }
    tr.totals td { font-weight: 700; background: #2a221b; }
    tr.work td { font-weight: 700; color: var(--accent); background: #2f2418; border-bottom: 0; }
    .meta {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }
    .field { display: flex; flex-direction: column; gap: 4px; text-align: left; flex: 0 0 auto; }
    .field.date { width: 7.2ch; }
    .field.level, .field.weight { width: 3.2ch; }
    .field label { font-size: .62rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .field input {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 4px;
      color: var(--text);
      min-height: 34px;
      font-size: 16px;
      text-align: center;
    }
    .ex-name {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 2px;
      color: var(--text);
      min-height: 30px;
      font-size: 13px;
    }
    .ex-name:focus { background: var(--input); border-color: var(--line); }
    table.sheet { table-layout: fixed; width: 100%; }
    table.sheet col.c-ex { width: auto; }
    table.sheet col.c-round { width: 2.05rem; }
    table.sheet col.c-tot { width: 2.2rem; }
    table.sheet col.c-x { width: 1.25rem; }
    td.ex, th.ex { width: auto; }
    .ex-name {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 0;
      color: var(--text);
      min-height: 30px;
      font-size: 12.5px;
      letter-spacing: -0.01em;
    }
    .cell-input {
      width: 100%;
      max-width: 2.05rem;
      min-width: 0;
      background: var(--input);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 0;
      text-align: center;
      font-size: 16px;
    }
    .hdr-long { display: none; }
    .card-title { margin: 0; font-size: .95rem; font-weight: 700; letter-spacing: .02em; }
    .cell-input:focus, .field input:focus, .ex-name:focus {
      outline: 2px solid rgba(224,154,62,.45);
      border-color: var(--accent);
    }
    .computed { color: var(--accent); font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .up { color: var(--good); }
    .down { color: var(--bad); }
    .progress-wrap { overflow-x: auto; }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .icon-btn {
      width: 22px; height: 22px; border-radius: 6px; padding: 0;
      border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
      font-size: 14px; line-height: 1;
    }
    .workout-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px; }
    .toast {
      position: fixed; left: 50%; bottom: calc(18px + var(--safe-b));
      transform: translateX(-50%) translateY(20px);
      background: #3a2f24; border: 1px solid var(--accent-2); color: var(--text);
      padding: 10px 14px; border-radius: 999px; opacity: 0; pointer-events: none;
      transition: .25s ease; z-index: 20; font-size: .9rem;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    dialog {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 16px;
      width: min(440px, calc(100vw - 24px));
      padding: 0;
    }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    .dlg { padding: 18px; }
    .dlg h3 { margin: 0 0 8px; }
    .dlg p { color: var(--muted); margin: 0 0 14px; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; }
    .save-note { color: var(--faint); font-size: .7rem; margin-top: 8px; }
    .empty { padding: 20px 12px; text-align: center; color: var(--muted); }
    .card-head .ex-name { max-width: none; min-height: 30px; font-size: 13px; padding: 4px 2px; }
    @media (min-width: 700px) {
      .field.date { width: 11ch; }
      .field.level, .field.weight { width: 4.2ch; }
      table.sheet col.c-round { width: 4.2rem; }
      table.sheet col.c-tot { width: 4.6rem; }
      .cell-input { max-width: none; }
      .hdr-short { display: none; }
      .hdr-long { display: inline; }
      .ex-name { font-size: 15px; }
    }
    @media (max-width: 900px) {
      .sub { display: none; }
    }
    @media (max-width: 430px) {
      header.top { flex-wrap: wrap; align-items: flex-start; }
      .actions { width: 100%; }
    }
    @media print {
      body { background: #fff; color: #111; }
      .actions, .tabs, .workout-tools, .toast, .save-note, .icon-btn { display: none !important; }
      .card { box-shadow: none; border-color: #ccc; }
      .cell-input, .field input, .ex-name { border: 0; background: transparent; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="mark">2H</div>
        <div>
          <h1>2H Level 1 Tracker</h1>
          <div class="sub">Progress rollup + expandable workout sheets. Formulas stay live.</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnExport" type="button">Export backup</button>
        <button class="btn" id="btnImport" type="button">Import</button>
        <button class="btn primary" id="btnAdd" type="button">+ New workout</button>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <section class="cloud" id="cloudBar"></section>
    <main id="main"></main>
    <p class="save-note"><span class="status-dot"></span>Cloud saves the log for every device that has the sync code. The code is the password — don’t post it publicly.</p>
  </div>

  <div class="toast" id="toast"></div>
  <input id="fileImport" type="file" accept="application/json,.json" hidden />

  <dialog id="confirmDlg">
    <div class="dlg">
      <h3 id="dlgTitle">Confirm</h3>
      <p id="dlgBody"></p>
      <div class="dlg-actions">
        <button class="btn ghost" id="dlgCancel" type="button">Cancel</button>
        <button class="btn danger" id="dlgOk" type="button">Delete</button>
      </div>
    </div>
  </dialog>

  <script>
    const STORAGE_KEY = "twohand-lvl1-tracker-v1";
    const CLOUD_KEY = "twohand-lvl1-cloud-v1";
    const CLOUD_BASE = "https://kvdb.io";
    const DEFAULT_EXERCISES = [
      "Balance Squat",
      "Side-to-Side Swing",
      "Dead Clean",
      "Balance Step Back Lunge",
      "2 Hand Pullover",
      "Front Sing Clean",
      "Flat Back Pullover",
      "Inside Circle"
    ];

    const uid = () => Math.random().toString(36).slice(2, 10);

    function blankExercises(reps = 0) {
      return DEFAULT_EXERCISES.map(name => ({ name, r1: reps, r2: reps, r3: reps, r4: reps }));
    }

    function defaultState() {
      return {
        title: "2H Level 1",
        active: "progress",
        workouts: [
          {
            id: "sheet1",
            name: "Workout 1",
            date: "",
            level: 1,
            weight: 15,
            exercises: blankExercises(20)
          },
          {
            id: "sheet2",
            name: "Workout 2",
            date: "",
            level: "",
            weight: 15,
            exercises: blankExercises(22)
          }
        ]
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        if (!parsed.workouts || !parsed.workouts.length) return defaultState();
        parsed.workouts.forEach(w => {
          w.date = String(w.date || "").replace(/[^\d]/g, "").slice(0, 10);
          const iso = String(w.date);
          if (iso.length === 8) w.date = iso.slice(2);
          w.name = workoutLabel(w);
        });
        return parsed;
      } catch {
        return defaultState();
      }
    }

    let state = loadState();
    let cloud = loadCloud();
    let applyingRemote = false;
    let dirty = false;
    let pushTimer = null;

    function loadCloud() {
      try { return JSON.parse(localStorage.getItem(CLOUD_KEY)) || {}; }
      catch { return {}; }
    }
    function saveCloudMeta() {
      localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud));
    }
    function setCloudStatus(msg, kind) {
      const el = document.getElementById("cloudStatus");
      if (!el) return;
      el.textContent = msg;
      el.className = "cloud-status" + (kind ? " " + kind : "");
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!applyingRemote && cloud.bucket) {
        dirty = true;
        clearTimeout(pushTimer);
        pushTimer = setTimeout(() => pushCloud().catch(err => setCloudStatus(err.message || "Cloud save failed", "bad")), 700);
      }
    }

    function cloudPayload() {
      return {
        updatedAt: new Date().toISOString(),
        title: state.title,
        active: state.active,
        workouts: state.workouts
      };
    }

    async function pushCloud() {
      if (!cloud.bucket) return;
      setCloudStatus("Saving…");
      const data = cloudPayload();
      const res = await fetch(CLOUD_BASE + "/" + cloud.bucket + "/log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error((await res.text()) || "Cloud save failed");
      state.updatedAt = data.updatedAt;
      dirty = false;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setCloudStatus("Saved to cloud", "ok");
    }

    function applyRemote(data) {
      if (!data || !data.workouts) return false;
      applyingRemote = true;
      const active = state.active;
      state = {
        title: data.title || "2H Level 1",
        active: data.workouts.some(w => w.id === active) ? active : (data.active || "progress"),
        workouts: data.workouts,
        updatedAt: data.updatedAt || ""
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
      applyingRemote = false;
      dirty = false;
      return true;
    }

    async function pullCloud(force) {
      if (!cloud.bucket || applyingRemote) return;
      if (!force && dirty) return;
      if (!force && document.activeElement && document.activeElement.closest("main, .meta, table")) return;
      const res = await fetch(CLOUD_BASE + "/" + cloud.bucket + "/log");
      if (res.status === 404) return;
      if (!res.ok) throw new Error((await res.text()) || "Cloud read failed");
      const data = await res.json();
      if (!force && state.updatedAt && data.updatedAt && data.updatedAt <= state.updatedAt) return;
      if (applyRemote(data)) setCloudStatus("Updated from cloud", "ok");
    }

    async function startCloud(email) {
      setCloudStatus("Creating cloud log…");
      const secret = uid() + uid();
      const body = new URLSearchParams({ email, default_ttl: "315360000", secret_key: secret });
      const res = await fetch(CLOUD_BASE, { method: "POST", body });
      const text = (await res.text()).trim();
      if (!res.ok || text.length < 8 || text.includes(" ")) throw new Error(text || "Could not create cloud log");
      cloud = { bucket: text, email, secret };
      saveCloudMeta();
      if (location.hash !== "#" + text) history.replaceState(null, "", "#" + text);
      await pushCloud();
      renderCloud();
      toast("Cloud log created");
    }

    async function connectCloud(code) {
      const bucket = String(code || "").trim().replace(/^#/, "");
      if (!bucket) return;
      setCloudStatus("Connecting…");
      const res = await fetch(CLOUD_BASE + "/" + bucket + "/log");
      if (res.status === 404) throw new Error("No log on that code yet");
      if (!res.ok) throw new Error((await res.text()) || "Could not connect");
      const data = await res.json();
      cloud = { bucket };
      saveCloudMeta();
      if (location.hash !== "#" + bucket) history.replaceState(null, "", "#" + bucket);
      applyRemote(data);
      setCloudStatus("Connected", "ok");
      toast("Connected to cloud log");
    }

    function num(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : 0;
    }

    function rowTotal(ex) {
      return num(ex.r1) + num(ex.r2) + num(ex.r3) + num(ex.r4);
    }

    function workoutStats(w) {
      const totalReps = w.exercises.reduce((s, ex) => s + rowTotal(ex), 0);
      const weight = num(w.weight);
      const work = totalReps * weight;
      const rounds = [0, 0, 0, 0];
      w.exercises.forEach(ex => {
        rounds[0] += num(ex.r1);
        rounds[1] += num(ex.r2);
        rounds[2] += num(ex.r3);
        rounds[3] += num(ex.r4);
      });
      return { totalReps, weight, work, rounds };
    }

    function progressRows() {
      return state.workouts.map((w, i) => {
        const stats = workoutStats(w);
        const prev = i > 0 ? workoutStats(state.workouts[i - 1]).work : 0;
        const ratio = prev > 0 ? stats.work / prev : null;
        return { workout: w, stats, ratio, index: i };
      });
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString();
    }

    function fmtPct(ratio) {
      if (ratio == null) return "—";
      return (ratio * 100).toFixed(2) + "%";
    }

    function fmtX(ratio) {
      if (ratio == null) return "";
      return ratio.toFixed(2) + "x";
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function workoutLabel(w) {
      let d = String(w.date || "").trim();
      const iso = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) d = iso[1].slice(2) + iso[2] + iso[3];
      if (!d) d = "------";
      const lvl = w.level === "" || w.level == null ? "—" : w.level;
      const wt = w.weight === "" || w.weight == null ? "—" : w.weight;
      return d + ": " + lvl + ": " + wt;
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      const items = [{ id: "progress", label: "Progress" }].concat(
        state.workouts.map((w) => ({ id: w.id, label: workoutLabel(w) }))
      );
      tabs.innerHTML = items.map(item =>
        `<button class="tab ${state.active === item.id ? "active" : ""}" data-id="${item.id}" type="button">${escapeHtml(item.label)}</button>`
      ).join("");
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderProgress() {
      const rows = progressRows();
      const latest = rows[rows.length - 1];
      return `
        <section class="card">
          <div class="card-head">
            <h2>Progress</h2>
            <div class="muted">Work = Total Reps × Weight · Progress = this Work ÷ previous Work</div>
          </div>
          <div class="progress-wrap">
            <table>
              <thead>
                <tr>
                  <th class="ex">Workout</th>
                  <th>Date</th>
                  <th>Level</th>
                  <th>Weight</th>
                  <th>Work</th>
                  <th>Progress</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr>
                    <td class="ex"><button class="btn ghost" data-open="${r.workout.id}" type="button">${escapeHtml(workoutLabel(r.workout))}</button></td>
                    <td>${escapeHtml(r.workout.date || "—")}</td>
                    <td>${escapeHtml(r.workout.level === "" || r.workout.level == null ? "—" : r.workout.level)}</td>
                    <td>${escapeHtml(r.workout.weight === "" || r.workout.weight == null ? "—" : r.workout.weight)}</td>
                    <td class="computed">${fmt(r.stats.work)}</td>
                    <td class="${r.ratio == null ? "muted" : r.ratio >= 1 ? "up" : "down"}">
                      ${fmtPct(r.ratio)}${r.ratio == null ? "" : " <span class='muted'>(" + fmtX(r.ratio) + ")</span>"}
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          <p class="hint">
            ${latest ? `Latest work ${fmt(latest.stats.work)} from ${fmt(latest.stats.totalReps)} reps at ${latest.stats.weight || 0}.` : "Add a workout to start tracking."}
            Same formulas as the spreadsheet: Sheet totals feed this page automatically.
          </p>
        </section>
      `;
    }

    function renderWorkout(w, index) {
      const stats = workoutStats(w);
      const prev = index > 0 ? workoutStats(state.workouts[index - 1]).work : 0;
      const ratio = prev > 0 ? stats.work / prev : null;
      return `
        <section class="card" data-workout="${w.id}">
          <div class="card-head">
            <h2 class="card-title" id="workoutTitle">${escapeHtml(workoutLabel(w))}</h2>
            <div class="row-actions">
              <button class="btn" data-fill type="button">Fill from Round 1</button>
              <button class="btn danger" data-delete type="button">Delete</button>
            </div>
          </div>
          <div class="meta">
            <div class="field date">
              <label>Date</label>
              <input type="text" inputmode="numeric" maxlength="10" placeholder="YYMMDD" data-k="date" value="${escapeHtml(w.date || "")}" />
            </div>
            <div class="field level">
              <label>Lvl</label>
              <input type="text" inputmode="numeric" maxlength="2" data-k="level" value="${escapeHtml(w.level)}" />
            </div>
            <div class="field weight">
              <label>Wt</label>
              <input type="text" inputmode="numeric" maxlength="2" data-k="weight" value="${escapeHtml(w.weight)}" />
            </div>
          </div>
          <div class="progress-wrap">
            <table class="sheet">
              <colgroup>
                <col class="c-ex" />
                <col class="c-round" />
                <col class="c-round" />
                <col class="c-round" />
                <col class="c-round" />
                <col class="c-tot" />
                <col class="c-x" />
              </colgroup>
              <thead>
                <tr>
                  <th class="ex">Exercise</th>
                  <th class="round"><span class="hdr-long">Round 1</span><span class="hdr-short">R1</span></th>
                  <th class="round"><span class="hdr-long">Round 2</span><span class="hdr-short">R2</span></th>
                  <th class="round"><span class="hdr-long">Round 3</span><span class="hdr-short">R3</span></th>
                  <th class="round"><span class="hdr-long">Round 4</span><span class="hdr-short">R4</span></th>
                  <th class="tot"><span class="hdr-long">Total</span><span class="hdr-short">Tot</span></th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${w.exercises.map((ex, i) => `
                  <tr data-ex="${i}">
                    <td class="ex"><input class="ex-name" data-exk="name" value="${escapeHtml(ex.name)}" /></td>
                    <td class="round"><input class="cell-input" type="text" inputmode="numeric" maxlength="3" data-exk="r1" value="${ex.r1}" /></td>
                    <td class="round"><input class="cell-input" type="text" inputmode="numeric" maxlength="3" data-exk="r2" value="${ex.r2}" /></td>
                    <td class="round"><input class="cell-input" type="text" inputmode="numeric" maxlength="3" data-exk="r3" value="${ex.r3}" /></td>
                    <td class="round"><input class="cell-input" type="text" inputmode="numeric" maxlength="3" data-exk="r4" value="${ex.r4}" /></td>
                    <td class="tot computed">${fmt(rowTotal(ex))}</td>
                    <td><button class="icon-btn" data-del-ex title="Remove exercise" type="button">×</button></td>
                  </tr>
                `).join("")}
                <tr class="totals">
                  <td class="ex">Total Reps</td>
                  <td>${fmt(stats.rounds[0])}</td>
                  <td>${fmt(stats.rounds[1])}</td>
                  <td>${fmt(stats.rounds[2])}</td>
                  <td>${fmt(stats.rounds[3])}</td>
                  <td class="computed">${fmt(stats.totalReps)}</td>
                  <td></td>
                </tr>
                <tr class="work">
                  <td class="ex">Work (Total Reps × Weight)</td>
                  <td colspan="4" class="muted">${fmt(stats.totalReps)} × ${stats.weight || 0}</td>
                  <td class="computed">${fmt(stats.work)}</td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="workout-tools">
            <button class="btn" data-add-ex type="button">+ Add exercise</button>
            <span class="muted" style="align-self:center">
              Progress vs previous: <strong class="${ratio == null ? "" : ratio >= 1 ? "up" : "down"}">${fmtPct(ratio)}</strong>
              ${ratio == null ? "(first session)" : "(" + fmtX(ratio) + ")"}
            </span>
          </div>
        </section>
      `;
    }

    function renderCloud() {
      const bar = document.getElementById("cloudBar");
      if (!bar) return;
      if (cloud.bucket) {
        bar.innerHTML = `
          <span class="cloud-status ok" id="cloudStatus">Cloud on</span>
          <input class="code" id="cloudCode" readonly value="${escapeHtml(cloud.bucket)}" />
          <button class="btn" id="cloudCopy" type="button">Copy code</button>
          <button class="btn" id="cloudSync" type="button">Sync now</button>
        `;
      } else {
        bar.innerHTML = `
          <input class="email" id="cloudEmail" type="email" placeholder="Email to start cloud log" />
          <button class="btn primary" id="cloudStart" type="button">Start cloud</button>
          <input class="code" id="cloudPaste" placeholder="Paste sync code" />
          <button class="btn" id="cloudConnect" type="button">Connect</button>
          <span class="cloud-status" id="cloudStatus"></span>
        `;
      }
    }

    function render() {
      renderTabs();
      renderCloud();
      const main = document.getElementById("main");
      if (state.active === "progress") {
        main.innerHTML = renderProgress();
      } else {
        const idx = state.workouts.findIndex(w => w.id === state.active);
        if (idx < 0) {
          state.active = "progress";
          main.innerHTML = renderProgress();
        } else {
          main.innerHTML = renderWorkout(state.workouts[idx], idx);
        }
      }
    }

    function currentWorkout() {
      return state.workouts.find(w => w.id === state.active);
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-id]");
      if (!btn) return;
      state.active = btn.dataset.id;
      render();
    });

    document.getElementById("main").addEventListener("click", (e) => {
      const open = e.target.closest("[data-open]");
      if (open) {
        state.active = open.dataset.open;
        render();
        return;
      }
      const w = currentWorkout();
      if (!w) return;
      if (e.target.closest("[data-add-ex]")) {
        w.exercises.push({ name: "New exercise", r1: 0, r2: 0, r3: 0, r4: 0 });
        render();
        return;
      }
      if (e.target.closest("[data-fill]")) {
        w.exercises.forEach(ex => {
          ex.r2 = ex.r1;
          ex.r3 = ex.r1;
          ex.r4 = ex.r1;
        });
        render();
        toast("Copied Round 1 across all rounds");
        return;
      }
      if (e.target.closest("[data-delete]")) {
        confirmDelete(`Delete ${workoutLabel(w)}?`, () => {
          state.workouts = state.workouts.filter(x => x.id !== w.id);
          state.active = "progress";
          render();
          toast("Workout deleted");
        });
        return;
      }
      const delEx = e.target.closest("[data-del-ex]");
      if (delEx) {
        const row = delEx.closest("[data-ex]");
        const i = Number(row.dataset.ex);
        w.exercises.splice(i, 1);
        render();
      }
    });

    document.getElementById("main").addEventListener("input", (e) => {
      const w = currentWorkout();
      if (!w) return;
      const key = e.target.dataset.k;
      if (key) {
        let val = e.target.value;
        if (key === "date") val = val.replace(/[^\d]/g, "").slice(0, 10);
        if (key === "level" || key === "weight") val = val.replace(/[^\d]/g, "").slice(0, 2);
        if (val !== e.target.value) e.target.value = val;
        w[key] = val === "" ? "" : (key === "date" ? val : Number(val));
        w.name = workoutLabel(w);
        const title = document.getElementById("workoutTitle");
        if (title) title.textContent = workoutLabel(w);
        const tab = document.querySelector(`.tab[data-id="${w.id}"]`);
        if (tab) tab.textContent = workoutLabel(w);
        if (key === "weight" || key === "level") refreshComputed(w);
        saveState();
        return;
      }
      const exk = e.target.dataset.exk;
      if (exk) {
        const row = e.target.closest("[data-ex]");
        const i = Number(row.dataset.ex);
        if (exk === "name") {
          w.exercises[i][exk] = e.target.value;
        } else {
          const val = e.target.value.replace(/[^\d]/g, "").slice(0, 3);
          if (val !== e.target.value) e.target.value = val;
          w.exercises[i][exk] = val === "" ? "" : Number(val);
        }
        refreshComputed(w);
        saveState();
      }
    });

    function refreshComputed(w) {
      const stats = workoutStats(w);
      const idx = state.workouts.findIndex(x => x.id === w.id);
      const prev = idx > 0 ? workoutStats(state.workouts[idx - 1]).work : 0;
      const ratio = prev > 0 ? stats.work / prev : null;
      const rows = document.querySelectorAll("[data-ex]");
      rows.forEach((row) => {
        const i = Number(row.dataset.ex);
        const totalCell = row.children[5];
        if (totalCell) totalCell.textContent = fmt(rowTotal(w.exercises[i]));
      });
      const totals = document.querySelector("tr.totals");
      if (totals) {
        totals.children[1].textContent = fmt(stats.rounds[0]);
        totals.children[2].textContent = fmt(stats.rounds[1]);
        totals.children[3].textContent = fmt(stats.rounds[2]);
        totals.children[4].textContent = fmt(stats.rounds[3]);
        totals.children[5].textContent = fmt(stats.totalReps);
      }
      const work = document.querySelector("tr.work");
      if (work) {
        work.children[1].textContent = `${fmt(stats.totalReps)} × ${stats.weight || 0}`;
        work.children[2].textContent = fmt(stats.work);
      }
      const prog = document.querySelector(".workout-tools .muted strong");
      if (prog) {
        prog.textContent = fmtPct(ratio);
        prog.className = ratio == null ? "" : ratio >= 1 ? "up" : "down";
      }
    }

    document.getElementById("btnAdd").addEventListener("click", () => {
      const last = state.workouts[state.workouts.length - 1];
      const nextNum = state.workouts.length + 1;
      const clone = last ? {
        id: uid(),
        name: "",
        date: "",
        level: last.level,
        weight: last.weight,
        exercises: last.exercises.map(ex => ({ ...ex }))
      } : {
        id: uid(),
        name: "",
        date: "",
        level: 1,
        weight: 15,
        exercises: blankExercises(20)
      };
      clone.name = workoutLabel(clone);
      state.workouts.push(clone);
      state.active = clone.id;
      render();
      toast("New workout added — edit reps as you go");
    });

    document.getElementById("btnExport").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "2H-lvl-1-tracker.json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("Backup downloaded");
    });

    document.getElementById("btnImport").addEventListener("click", () => {
      document.getElementById("fileImport").click();
    });

    document.getElementById("fileImport").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (!parsed.workouts) throw new Error("Invalid file");
        state = parsed;
        if (!state.active) state.active = "progress";
        render();
        toast("Backup restored");
      } catch {
        toast("Could not read that file");
      }
    });

    function confirmDelete(message, onOk) {
      const dlg = document.getElementById("confirmDlg");
      document.getElementById("dlgBody").textContent = message;
      const ok = document.getElementById("dlgOk");
      const cancel = document.getElementById("dlgCancel");
      const cleanup = () => {
        ok.onclick = null;
        cancel.onclick = null;
        dlg.close();
      };
      ok.onclick = () => { cleanup(); onOk(); };
      cancel.onclick = cleanup;
      dlg.showModal();
    }

    document.getElementById("cloudBar").addEventListener("click", async (e) => {
      try {
        if (e.target.id === "cloudStart") {
          const email = document.getElementById("cloudEmail").value.trim();
          if (!email.includes("@")) { setCloudStatus("Enter a real email", "bad"); return; }
          await startCloud(email);
        }
        if (e.target.id === "cloudConnect") {
          await connectCloud(document.getElementById("cloudPaste").value);
        }
        if (e.target.id === "cloudCopy") {
          await navigator.clipboard.writeText(cloud.bucket);
          toast("Sync code copied");
        }
        if (e.target.id === "cloudSync") {
          if (dirty) await pushCloud();
          else await pullCloud(true);
        }
      } catch (err) {
        setCloudStatus(err.message || "Cloud error", "bad");
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") pullCloud(false).catch(() => {});
    });
    setInterval(() => pullCloud(false).catch(() => {}), 12000);

    const hashCode = location.hash.replace(/^#/, "");
    if (hashCode && !cloud.bucket) cloud = { bucket: hashCode };
    if (cloud.bucket) {
      saveCloudMeta();
      pullCloud(true).catch(err => setCloudStatus(err.message || "Could not reach cloud", "bad"));
    }

    render();
  </script>
</body>
</html>
